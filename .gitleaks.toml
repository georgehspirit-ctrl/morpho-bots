# Scans the public snapshot before it is pushed (packages/ci-scripts/src/public-mirror). The default
# generic-api-key rule fires on any long hex literal, so the two shapes this repo legitimately
# commits are allowlisted: 20-byte EVM addresses (public by definition) and Anvil's ten published
# developer keys, which the fork tests fund on a local chain. Any other 32-byte hex literal still
# fails the scan.
[extend]
useDefault = true

[[allowlists]]
description = "EVM addresses are public identifiers (anchored, so a 32-byte key never matches)"
regexes = ['''^0x[0-9a-fA-F]{40}$''']

[[allowlists]]
description = "Anvil default developer keys (foundry-rs/foundry, `anvil` banner)"
regexes = [
  '''^(0x)?ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80$''',
  '''^(0x)?59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d$''',
  '''^(0x)?5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a$''',
  '''^(0x)?7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6$''',
  '''^(0x)?47e179ec197488593b187f80a00eb0da91f1b9d0b13f8733639f19c30a34926a$''',
  '''^(0x)?8b3a350cf5c34c9194ca85829a2df0ec3153be0318b5e2d3348e872092edffba$''',
  '''^(0x)?92db14e403b83dfe3df233f83dfa3a0d7096f21ca9b0d6d6b8d88b2b4ec1564e$''',
  '''^(0x)?4bbbf85ce3377467afe5d46f804f221813b2bb87f24d81f60f1fcdbf7cbf4356$''',
  '''^(0x)?dbda1821b80551c9d65939329250298aa3472ba22feea921c0cf5d620ea67b97$''',
  '''^(0x)?2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6$'''
]

[[allowlists]]
description = "Env-var prose in READMEs (`ENABLE_<VENUE>=true`) is not a token"
regexes = ['''^ENABLE_[A-Z_]+=true$''']
