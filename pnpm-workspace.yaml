packages:
  - bots/*
  - packages/*

engineStrict: true
saveExact: true
verifyStoreIntegrity: true
preferOffline: true

# 3 days — carried over from bunfig.toml's `minimumReleaseAge = 259200` (seconds; this is minutes).
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@morpho-org/*'

# No dependency lifecycle script runs unless opted in here — add entries deliberately. esbuild is
# the only dependency in the tree that needs one; any future addition is a reviewable change.
allowBuilds:
  esbuild: true
# Make an un-opted-in build script a hard install failure, not a warning. Without this the
# default-deny above is advisory, which defeats the point of the migration.
strictDepBuilds: true

# pnpm does not run npm-style pre/post scripts by default. Nothing depends on them today (the bots
# build explicitly, at image-build time), but keep npm-compatible behavior so a future `pre*`/`post*`
# script does not silently never run.
enablePrePostScripts: true

# Migrating the lockfile re-resolves every caret range, so entries that bun.lock had already
# resolved to a lower version are pinned exactly here. This keeps the migration a no-op on
# dependency versions, per the TIB's non-goal; relaxing any of these is a separate, deliberate bump.
catalog:
  # Pinned exactly for the quoter-bot direct-KMS path.
  '@aws-sdk/client-kms': 3.1101.0
  '@internationalized/date': 3.12.1
  '@tanstack/react-form': 1.20.0
  '@tanstack/react-table': 8.21.3
  '@loglayer/transport-betterstack': 2.2.0
  # Matches what @morpho-org/morpho-sdk (quoter-bot) resolves, so one blue-sdk instance.
  '@morpho-org/blue-sdk': 6.7.0
  '@morpho-org/blue-sdk-viem': 5.4.0
  '@morpho-org/midnight-sdk': 1.3.0
  '@morpho-org/morpho-ts': 2.10.0
  '@morpho-org/viem-dlc': 0.0.11
  '@noble/curves': 1.9.1
  '@types/lodash-es': ^4.17.12
  '@types/node': 24.7.0
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  date-fns: 4.1.0
  esbuild: 0.28.1
  execa: 9.6.0
  executooor-viem: ^1.3.3
  husky: ^9.1.5
  knip: ^5.86.0
  lint-staged: ^16.1.2
  lodash-es: ^4.18.0
  loglayer: 9.3.0
  openapi-fetch: 0.17.0
  openapi-typescript: ^7.13.0
  react: 19.2.8
  react-dom: 19.2.8
  oxfmt: ^0.36.0
  # Pinned to what bun.lock resolved for `^1.46.0`. Newer minors change rule behavior and want
  # oxlint-tsgolint >= 0.24 — bump both together, deliberately, in a separate change.
  oxlint: 1.61.0
  oxlint-tsgolint: ^0.22.1
  # Pinned exactly: solc determines the compiled bytecode of the soltag `sol``` lens templates and
  # the Executor. A silent compiler bump would invalidate the recorded explorer-verification
  # settings (0.8.35, optimizer runs=200).
  solc: 0.8.35
  soltag: ^0.0.17
  tsx: 4.21.0
  typescript: 6.0.2
  viem: 2.47.17
  vite: 7.3.6
  vitest: 4.1.2
  # Must match the zod that `@morpho-org/morpho-sdk` (and knip) resolve. viem's transitive `abitype`
  # declares an optional peer on zod, so a workspace package holding a DIFFERENT zod major gets its
  # own peer-variation copy of viem — two `BaseError` classes, and every cross-package `instanceof`
  # against a viem error silently returns false. `test/viem-dedupe.test.ts` guards the invariant.
  zod: 4.4.3
