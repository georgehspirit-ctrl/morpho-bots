name: Publish quoter-bot Docker Hub

# Publish-only job for quoter-bot's public Docker Hub image. It runs when a `quoter-bot-*` release
# tag is pushed: the repo-root build of bots/quoter-bot/Dockerfile at the tagged commit is pushed
# tagged with the commit hash and, when no newer release has shipped, `latest`. Trust rests on two
# facts: this repository's tag ruleset restricts who can create, update, or delete tags, and every
# release commit sits on first-parent `main` and carries a `Source-Ref:` trailer — the gate below
# re-checks both before any working-tree code runs. Runs are not serialized, so several tags pushed
# at once each get their own run; the build pushes only the immutable commit tag, and `latest` is
# decided and moved as the final step after a fresh tag fetch, so the residual race is a newer
# release tag landing in the seconds between that fetch and the imagetools call. A wrong `latest`
# from that window self-heals on the next publish, or by dispatching the newer release tag.
# Authentication exchanges the run's GitHub OIDC token through the Docker org's OIDC connection
# (docker/login-action v4.5+), so CI stores no static Docker Hub credential.
#
# A missed publish is recoverable with workflow_dispatch. Select the release tag as the workflow
# ref: the tag to publish is taken from that ref (the optional `tag` input only confirms it), and
# the quoter-bot-dockerhub environment admits only `quoter-bot-*` tags.

on:
  push:
    tags: ['quoter-bot-*']
  workflow_dispatch:
    inputs:
      tag:
        description: quoter-bot-* release tag to publish; must equal the tag selected as the workflow ref
        required: false
        type: string

permissions:
  contents: read

jobs:
  Publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds secret DOCKERHUB_OIDC_CONNECTIONID plus vars DOCKER_USERNAME and DOCKER_REPOSITORY;
    # its deployment policy admits only `quoter-bot-*` tags, so the OIDC exchange is unreachable
    # from any branch. Referencing an environment also makes GitHub mint the OIDC token with an
    # environment-based subject (`repo:morpho-org/morpho-bots:environment:quoter-bot-dockerhub`) —
    # the Docker-side connection ruleset must match that subject, not a `ref:refs/heads/*` one.
    environment: quoter-bot-dockerhub
    permissions:
      contents: read
      # Mints the GitHub OIDC token docker/login-action exchanges for a Docker Hub access token.
      id-token: write
    steps:
      # Always check out `main` first — never the event ref. The job later executes code from the
      # working tree (the Dockerfile and everything it copies), so the commit it switches to must be
      # proven a first-parent-main release commit before any of that runs.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          # Full history and tags: the release gate and latest-tag gate need tags and ancestry.
          fetch-depth: 0

      # Resolve and validate the commit to publish before any working-tree code executes, using
      # only plain git against the just-fetched origin refs. The tag must be a `quoter-bot-*`
      # release tag selected as the workflow ref, and its commit must be on first-parent `main` and
      # carry a `Source-Ref:` trailer.
      - name: Select and gate the release commit
        id: commit
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Without -q: grep -q exits at the first match, and pipefail then reports rev-list's SIGPIPE.
          on_first_parent() { git rev-list --first-parent origin/main | grep -Fx "$1" >/dev/null; }
          tag="$REF_NAME"
          case "$REF_TYPE/$tag" in
            tag/quoter-bot-*) ;;
            *)
              echo "::error::${REF_TYPE} ${tag} is not a quoter-bot-* release tag; select the release tag as the workflow ref"
              exit 1
              ;;
          esac
          if [ -n "$TAG" ] && [ "$TAG" != "$tag" ]; then
            echo "::error::input tag ${TAG} does not match the workflow ref ${tag}; select the release tag as the workflow ref"
            exit 1
          fi
          if ! sha="$(git rev-parse --verify --quiet "refs/tags/${tag}^{commit}")"; then
            echo "::error::tag ${tag} does not exist on origin"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main || ! on_first_parent "$sha"; then
            echo "::error::${tag} points at ${sha}, which is not on first-parent main; refusing to publish it"
            exit 1
          fi
          if ! git log -1 --format='%(trailers:key=Source-Ref,valueonly)' "$sha" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::${tag} points at ${sha}, which carries no Source-Ref trailer and so is not a release commit; refusing to publish it"
            exit 1
          fi
          echo "publishing release ${tag}"
          git checkout --quiet --force "$sha"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      # Fail loud up front on a misconfigured environment instead of failing late at push time with
      # an opaque invalid-reference error.
      - name: Check environment configuration
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_REPOSITORY: ${{ vars.DOCKER_REPOSITORY }}
          DOCKERHUB_OIDC_CONNECTIONID: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
        run: |
          set -euo pipefail
          : "${DOCKER_USERNAME:?var unset in the quoter-bot-dockerhub environment}"
          : "${DOCKER_REPOSITORY:?var unset in the quoter-bot-dockerhub environment}"
          : "${DOCKERHUB_OIDC_CONNECTIONID:?secret unset in the quoter-bot-dockerhub environment}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
          # The exchanged access token must outlive the image build that runs between login and
          # push; the 300s default is shorter than this pnpm install + workspace build.
          DOCKERHUB_OIDC_EXPIREIN: '1800'
        with:
          username: ${{ vars.DOCKER_USERNAME }}

      # Docker tags are mutable by default. Check through the authenticated Docker session so a
      # first publish can distinguish a missing repository from an existing private tag. An existing
      # immutable tag is reused on reruns so a failed/missed `latest` update can recover safely.
      - name: Check immutable SHA tag
        id: sha-tag
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_REPOSITORY: ${{ vars.DOCKER_REPOSITORY }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          image="${DOCKER_USERNAME}/${DOCKER_REPOSITORY}:${COMMIT_SHA}"
          inspect_error="$(mktemp)"
          trap 'rm -f "$inspect_error"' EXIT
          if docker buildx imagetools inspect "$image" >/dev/null 2>"$inspect_error"; then
            echo 'commit SHA tag already exists; reusing immutable image'
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eqi 'manifest unknown|not found|pull access denied|repository does not exist' "$inspect_error"; then
            echo 'commit SHA tag is not readable; proceeding with first publish'
            exit 0
          fi
          echo 'unexpected Docker registry inspection failure'
          exit 1

      - name: Build and push
        if: ${{ steps.sha-tag.outputs.exists != 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # Path context (the gated checkout above) — the default Git context would rebuild from
          # the triggering ref instead. The context must be the repository root so workspace
          # packages resolve.
          context: .
          file: bots/quoter-bot/Dockerfile
          push: true
          # Only the immutable commit tag: `latest` is decided after this multi-minute build, below.
          tags: ${{ vars.DOCKER_USERNAME }}/${{ vars.DOCKER_REPOSITORY }}:${{ steps.commit.outputs.sha }}
          # Attach a full SLSA provenance attestation naming this repository and run, so the image's
          # origin is verifiable rather than inferred from the labels below.
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}

      # `latest` must only move forward. A rerun may legitimately backfill an older release's
      # commit tag, but when a newer `quoter-bot-*` release tag sits on first-parent main after the
      # built commit a newer release already shipped — leave `latest` where it is. Only the tag
      # ruleset's permitted actor can create release tags, so a tag on first-parent main is a
      # genuine release. Retagging the pushed manifest, rather than pushing `latest` from the build,
      # is what lets this decision run last and also recovers a previous attempt that published the
      # commit tag and then failed.
      - name: Move latest
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_REPOSITORY: ${{ vars.DOCKER_REPOSITORY }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          # Tags fetched at checkout predate the build; decide on tags as of now (see header).
          git fetch --quiet --tags --force origin
          on_first_parent() { git rev-list --first-parent origin/main | grep -Fx "$1" >/dev/null; }
          for tag in $(git tag -l 'quoter-bot-*'); do
            commit="$(git rev-parse "${tag}^{commit}")"
            if [ "$commit" != "$COMMIT_SHA" ] \
              && git merge-base --is-ancestor "$COMMIT_SHA" "$commit" \
              && on_first_parent "$commit"; then
              echo "::notice::release ${tag} descends from ${COMMIT_SHA}; not moving latest"
              exit 0
            fi
          done
          image="${DOCKER_USERNAME}/${DOCKER_REPOSITORY}:${COMMIT_SHA}"
          latest="${DOCKER_USERNAME}/${DOCKER_REPOSITORY}:latest"
          docker buildx imagetools create --tag "$latest" "$image"
