# Runs the combined setup, bootstrap, and ladder monitor from the package-owned production image.
services:
  bot:
    build:
      context: ../..
      dockerfile: bots/quoter-bot/Dockerfile
    environment:
      CHAIN_ID: ${CHAIN_ID:-8453}
      RPC_URL: ${RPC_URL:?set RPC_URL}
      REFERENCE_RPC_URL: ${REFERENCE_RPC_URL:-}
      KEY_STORAGE_METHOD: ${KEY_STORAGE_METHOD:-}
      MAKER_PRIVATE_KEY: ${MAKER_PRIVATE_KEY:-}
      KEYSTORE_PATH: ${KEYSTORE_PATH:-}
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:-}
      KEYSTORE_INTERACTIVE: ${KEYSTORE_INTERACTIVE:-}
      AWS_KMS_KEY_ID: ${AWS_KMS_KEY_ID:-}
      AWS_REGION: ${AWS_REGION:-}
      MAKER_ADDRESS: ${MAKER_ADDRESS:?set MAKER_ADDRESS}
      MIDNIGHT_ADDRESS: ${MIDNIGHT_ADDRESS:?set MIDNIGHT_ADDRESS}
      LOAN_ASSET_ADDRESS: ${LOAN_ASSET_ADDRESS:?set LOAN_ASSET_ADDRESS}
      RATIFIER_ADDRESS: ${RATIFIER_ADDRESS:?set RATIFIER_ADDRESS}
      MORPHO_API_BASE_URL: ${MORPHO_API_BASE_URL:?set MORPHO_API_BASE_URL}
      MARKET_IDS: ${MARKET_IDS:?set MARKET_IDS}
      REFERENCE_MARKET_ID: ${REFERENCE_MARKET_ID:-}
      REFERENCE_LOOKBACK_SECONDS: ${REFERENCE_LOOKBACK_SECONDS:-}
      V0_OFFER_GROUP_IDS: ${V0_OFFER_GROUP_IDS:-}
      NATIVE_RESERVE_WEI: ${NATIVE_RESERVE_WEI:?set NATIVE_RESERVE_WEI}
      SIGNER_NATIVE_RESERVE_WEI: ${SIGNER_NATIVE_RESERVE_WEI:-}
      MAX_FEE_GWEI: ${MAX_FEE_GWEI:?set MAX_FEE_GWEI}
      PRIORITY_FEE_GWEI: ${PRIORITY_FEE_GWEI:?set PRIORITY_FEE_GWEI}
      MAX_TRANSACTION_SPEND_WEI: ${MAX_TRANSACTION_SPEND_WEI:?set MAX_TRANSACTION_SPEND_WEI}
      MAX_PUBLICATION_GAS: ${MAX_PUBLICATION_GAS:?set MAX_PUBLICATION_GAS}
      MAX_PUBLICATION_DATA_BYTES: ${MAX_PUBLICATION_DATA_BYTES:?set MAX_PUBLICATION_DATA_BYTES}
      MAX_CANCELLATION_GAS: ${MAX_CANCELLATION_GAS:?set MAX_CANCELLATION_GAS}
      MAX_BATCH_CANCELLATION_GAS: ${MAX_BATCH_CANCELLATION_GAS:?set MAX_BATCH_CANCELLATION_GAS}
      MAX_BATCH_CANCELLATION_DATA_BYTES: ${MAX_BATCH_CANCELLATION_DATA_BYTES:?set MAX_BATCH_CANCELLATION_DATA_BYTES}
      MAX_RATIFICATION_GAS: ${MAX_RATIFICATION_GAS:-}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-10000}
      TRANSACTION_RECEIPT_TIMEOUT_MS: ${TRANSACTION_RECEIPT_TIMEOUT_MS:-180000}
      BOOTSTRAP_MARKETS: ${BOOTSTRAP_MARKETS:?set BOOTSTRAP_MARKETS}
      LADDER_MARKETS: ${LADDER_MARKETS:?set LADDER_MARKETS}
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN:-}
      BETTERSTACK_INGESTING_HOST: ${BETTERSTACK_INGESTING_HOST:-}
      BETTERSTACK_HEARTBEAT_URL: ${BETTERSTACK_HEARTBEAT_URL:-}
      XDG_STATE_HOME: /state
    restart: unless-stopped
    volumes:
      - quoter-bot-state:/state

volumes:
  quoter-bot-state:
