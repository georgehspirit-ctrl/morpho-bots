# Default values for the quoter-bot chart.
#
# The chart runs one quoter-bot container from the public Docker Hub image and feeds it the
# bot's native YAML configuration file rendered from `config` below, so one values file fully
# describes a deployment. See the chart README.md and the package-level
# bots/quoter-bot/README.md#configuration for every supported configuration key.

image:
  repository: morphoorg/quoter
  # Defaults to the chart appVersion (`latest`). Every release also publishes an immutable
  # commit-hash tag; pin one for reproducible deployments.
  tag: ''
  # `Always` is the safe default while the tag is `latest`; switch to `IfNotPresent` when
  # pinning an immutable commit tag.
  pullPolicy: Always
  # The published image is amd64-only, so the pod is pinned to amd64 nodes through a
  # kubernetes.io/arch nodeSelector entry (reserved against custom nodeSelector values). Clear
  # this only once a multi-architecture image exists.
  architecture: amd64

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

# Kubernetes only re-pulls the image when a pod is created, so with an unchanged pod template a
# moved mutable tag (like the default `latest`) is never picked up by `helm upgrade` alone. Set
# to true to stamp an upgrade-time annotation that rolls the pod on every `helm upgrade`;
# alternatively pin an immutable commit tag, or run
# `kubectl rollout restart statefulset/<release-name>` after the tag moves.
forceRestartOnUpgrade: false

# Dedicated ServiceAccount, primarily for workload-identity signers — with the `aws`
# key-storage method under AWS IRSA or EKS Pod Identity, set create: true and the provider
# annotation (for example eks.amazonaws.com/role-arn) so the pod carries the dedicated IAM
# identity instead of the namespace default account. The pod keeps
# automountServiceAccountToken: false: the bot never calls the Kubernetes API, and the cloud
# credential webhooks inject their own projected token volumes regardless of that flag.
# Changing these annotations rolls the pod through a checksum (identity webhooks act at pod
# admission); annotation changes on an externally managed account require a manual
# `kubectl rollout restart`.
serviceAccount:
  create: false
  # Existing account to use when create is false; empty selects the namespace default.
  name: ''
  annotations: {}

# Entrypoint for the bot process. The chart deliberately bypasses the image's
# railway-entrypoint.sh (which requires starting as root to chown the Railway volume) and runs
# the bundle directly as the image's unprivileged `node` user; the init container below handles
# volume ownership without changing the strict modes of restored state files.
command:
  - node
  - /repo/bots/quoter-bot/dist/src/index.js

# Root flags and command passed to the bot after the chart-managed `--config <file>` pair.
# Root flags precede the command, so for example a read-only rehearsal is
# ["--readonly", "start", "--verbose"] and a monitored readiness-check deployment is
# ["setup-check", "--monitor"].
args:
  - start
  - --verbose

# The complete quoter-bot YAML configuration, copied verbatim into a chart-managed Secret and
# passed to the bot with `--config`. The mapping uses the bot's native schema — the same
# `chain`, `identity`, `contracts`, `apis`, `markets`, `setup`, `bootstrap`, and `ladder` keys
# as bots/quoter-bot/quoter-bot.example.yaml — and the bot validates it at startup, failing
# loud on unknown keys or invalid values.
#
# IMPORTANT: quote every large integer (asset amounts, wei values, bytes32 IDs) as a YAML
# string, exactly like quoter-bot.example.yaml does. Helm parses unquoted numbers as floats,
# so an unquoted 10000000000000000 can re-render as 1e+16, which the bot rejects at startup.
#
# Prefer keeping the signing secret out of this block: leave `identity.makerPrivateKey`
# unset here and provide MAKER_PRIVATE_KEY (or the keystore/AWS alternatives) through
# `envFrom` below — every environment variable overrides its YAML counterpart. Alternatively
# set `existingConfigSecret` to manage the complete file outside Helm.
config: {}
# config:
#   chain:
#     id: 8453
#     rpcUrl: 'https://base-rpc.example'
#     archiveRpcUrl: 'https://base-archive-rpc.example'
#   identity:
#     makerAddress: '0x1111111111111111111111111111111111111111'
#   contracts:
#     midnightAddress: '0x2222222222222222222222222222222222222222'
#     loanAssetAddress: '0x3333333333333333333333333333333333333333'
#     ratifierAddress: '0x4444444444444444444444444444444444444444'
#   apis:
#     morphoBaseUrl: 'https://api.example'
#   markets:
#     allowlist:
#       - '0x5555555555555555555555555555555555555555555555555555555555555555'
#     referenceMarketId: '0x7777777777777777777777777777777777777777777777777777777777777777'
#     referenceLookbackSeconds: '259200'
#   setup:
#     nativeReserveWei: '10000000000000000'
#     signerNativeReserveWei: ''
#     maxFeeGwei: '100'
#     priorityFeeGwei: '0.01'
#     maxTransactionSpendWei: '100000000000000000'
#     maxPublicationGas: '5000000'
#     maxPublicationDataBytes: '65536'
#     maxCancellationGas: '100000'
#     maxBatchCancellationGas: '1000000'
#     maxBatchCancellationDataBytes: '65536'
#     maxRatificationGas: ''
#   bootstrap: []
#   ladder:
#     - marketId: '0x5555555555555555555555555555555555555555555555555555555555555555'
#       quotePremiumBps: '0'
#       spreadBps: '200'
#       stepBps: '100'
#       rungCount: '3'
#       sizeSkewBps: '0'
#       lowerRateBudgetAssets: '10000000000'
#       higherRateBudgetAssets: '10000000000'
#       targetMarketExposureAssets: '20000000000'
#       maximumTotalExposureAssets: '30000000000'
#       minimumOfferAssets: '101000000'
#       groupMode: 'shared-rung'
#       loopIntervalSeconds: '60'
#       bookCrossedCooldownSeconds: '180'
#       movementToleranceBps: '10'
#       minimumRateBps: '200'
#       maximumRateBps: '800'

# Name of a pre-created Secret holding the complete configuration file under the key
# `quoter-bot.yaml`. When set, the chart mounts that Secret instead of rendering one from
# `config`, keeping secrets out of Helm values and release storage entirely. Config changes in
# an existing Secret are not detected by upgrades; restart with
# `kubectl rollout restart statefulset/<release>-quoter-bot`.
existingConfigSecret: ''

# Extra environment variables (list of EnvVar objects). Environment values override their YAML
# counterparts, so this is the place for the signer secret and for the environment-only Better
# Stack settings (BETTERSTACK_SOURCE_TOKEN, BETTERSTACK_INGESTING_HOST,
# BETTERSTACK_HEARTBEAT_URL). XDG_STATE_HOME is chart-managed and reserved: entries with that
# name are ignored so durable ownership state cannot be detached from the retained PVC.
# Rotating a referenced Secret in place does not reach the running process — environment
# variables are captured at container start — so follow a signer rotation with
# `kubectl rollout restart statefulset/<release-name>`, exactly like an edited
# existingConfigSecret.
env: []
# env:
#   - name: MAKER_PRIVATE_KEY
#     valueFrom:
#       secretKeyRef:
#         name: quoter-bot-signer
#         key: makerPrivateKey
#   - name: BETTERSTACK_HEARTBEAT_URL
#     value: 'https://uptime.betterstack.com/api/v1/heartbeat/example'

# Extra envFrom sources (list of EnvFromSource objects), for injecting whole Secrets or
# ConfigMaps of environment overrides.
envFrom: []
# envFrom:
#   - secretRef:
#       name: quoter-bot-signer

# Durable ownership state (bot-issued offer-group IDs) lives under this mount; the chart
# always sets XDG_STATE_HOME to `mountPath`. Losing it makes previously bot-issued groups
# unknown, which fails readiness until an operator invalidates or adopts them — keep
# persistence enabled for write-mode deployments.
persistence:
  enabled: true
  mountPath: /state
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  # Set to a storage class name, or "-" to disable dynamic provisioning. Empty uses the
  # cluster default.
  storageClass: ''
  # Reuse a pre-created PersistentVolumeClaim instead of creating one.
  existingClaim: ''
  annotations: {}
  # Keep the claim (and the ownership state inside) when the release is uninstalled. A
  # reinstall under the same release name and namespace re-adopts it.
  retain: true

# Root init container that chowns the state volume to the runtime user, mirroring the image's
# railway-entrypoint.sh. This is deliberately chown-only: Kubernetes fsGroup handling can add
# group permission bits to restored state files, which the bot correctly rejects as insecure.
volumePermissions:
  enabled: true

# The runtime container runs as the bundled unprivileged `node` user (uid/gid 1000). Do not add
# fsGroup here: kubelet may chmod restored ownership-state files beyond their required 0600 mode.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container-level hardening. The root filesystem stays read-only: the bot writes only under
# XDG_STATE_HOME, and the chart mounts an emptyDir at /tmp.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources: {}
# resources:
#   requests:
#     cpu: 100m
#     memory: 256Mi
#   limits:
#     memory: 512Mi

# SIGTERM lets the in-flight cycle finish, then invalidates owned bootstrap and ladder offer
# groups through the shared serialized operation queue; every wait is bounded by
# setup.transactionReceiptTimeoutMs, and an in-flight cycle continues serially through every
# configured market before cleanup runs. Kubernetes' 30-second default would SIGKILL
# mid-cleanup and leave owned offers on the book. For a chart-managed `config` the rendered
# value is automatically floored to a wait count derived from the configured workload — three
# per bootstrap market (cancellation, Setter ratification, publication) + two per ladder
# market (ratification, publication) + the total ladder group count (in-flight cancellations;
# shared-rung markets contribute two groups per rung, per-book markets two) + two cleanup
# batches — times the receipt timeout rounded up to whole seconds (the declared value, or the
# bot's 180 s default), plus a two-minute drain buffer. Apply the same formula yourself when
# the market lists or timeout come from environment overrides or an existingConfigSecret,
# which the template cannot see. Groups persisted from a PREVIOUS configuration are also
# invisible: a shrinking upgrade (removed markets, reduced rung counts) triggers one serial
# cleanup wait per removed group at startup, so invalidate those groups first
# (`morpho-quoter invalidate` — a single maker-wide multicall) or temporarily raise this value
# for that upgrade.
terminationGracePeriodSeconds: 1020

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ''

# Extra volumes and mounts, for example a keystore file Secret for the `keystore` signer.
extraVolumes: []
extraVolumeMounts: []
