{{- /*
The claim is always rendered, so it stays release-managed on every upgrade (no pruning with
retain=false; size/annotation changes keep reconciling). A kept claim survives uninstall with
its Helm ownership metadata intact, so a same-name reinstall re-adopts it through Helm's
standard adoption path (Helm >= 3.2) instead of colliding; a pre-existing claim that was NOT
created by this release name fails Helm's ownership validation loudly — select such a claim
deliberately through persistence.existingClaim.
*/}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
# Holds the bot's durable offer-group ownership state (XDG_STATE_HOME). Deleting it makes
# previously bot-issued groups unknown, which fails readiness until an operator invalidates or
# adopts them, so the claim is kept on uninstall by default (persistence.retain).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Quoted: a numeric-looking override must stay a YAML string.
  name: {{ include "quoter-bot.stateClaimName" . | quote }}
  labels:
    {{- include "quoter-bot.labels" . | nindent 4 }}
  {{- $pvcAnnotations := .Values.persistence.annotations }}
  {{- if .Values.persistence.retain }}
  {{- $pvcAnnotations = omit $pvcAnnotations "helm.sh/resource-policy" }}
  {{- end }}
  {{- if or .Values.persistence.retain $pvcAnnotations }}
  annotations:
    {{- with $pvcAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.persistence.retain }}
    # Reserved while retain is true: custom annotations cannot override the keep policy that
    # protects the ownership-state claim from deletion on uninstall.
    helm.sh/resource-policy: keep
    {{- end }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- if .Values.persistence.storageClass }}
  {{- if eq "-" .Values.persistence.storageClass }}
  storageClassName: ''
  {{- else }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  {{- end }}
{{- end }}
