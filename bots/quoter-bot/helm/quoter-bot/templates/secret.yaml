{{- if and .Values.config (not .Values.existingConfigSecret) }}
# The complete bot configuration file, rendered verbatim from .Values.config. It is a Secret
# rather than a ConfigMap because identity configuration may carry signing material.
apiVersion: v1
kind: Secret
metadata:
  # Quoted: a numeric-looking override must stay a YAML string.
  name: {{ include "quoter-bot.configSecretName" . | quote }}
  labels:
    {{- include "quoter-bot.labels" . | nindent 4 }}
type: Opaque
data:
  quoter-bot.yaml: {{ include "quoter-bot.configYaml" . | b64enc }}
{{- end }}
