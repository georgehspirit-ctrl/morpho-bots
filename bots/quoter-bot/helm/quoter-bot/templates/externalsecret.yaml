{{- if .Values.externalSecret.enabled }}
# Extracts the whole Secrets Manager value as a flat JSON object of environment variables.
# creationPolicy Owner garbage-collects the rendered Secret with this ExternalSecret;
# deletionPolicy Retain keeps it (and the pod's env) if the ExternalSecret itself is removed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "quoter-bot.runtimeSecretName" . | quote }}
  labels:
    {{- include "quoter-bot.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ include "quoter-bot.fullname" . }}-aws
    kind: SecretStore
  target:
    name: {{ include "quoter-bot.runtimeSecretName" . | quote }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.remoteKey | quote }}
{{- end }}
