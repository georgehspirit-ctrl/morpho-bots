{{- if .Values.serviceAccount.create }}
# Dedicated identity for workload-identity signers (for example AWS IRSA or EKS Pod Identity
# for the `aws` key-storage method). The pod keeps automountServiceAccountToken: false — the
# bot never calls the Kubernetes API, and the cloud credential webhooks inject their own
# projected token volumes independently of that flag.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "quoter-bot.serviceAccountName" . | quote }}
  labels:
    {{- include "quoter-bot.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
